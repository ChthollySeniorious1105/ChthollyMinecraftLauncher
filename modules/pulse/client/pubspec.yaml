name: pulse_client
description: "Pulse 文字 / 语音聊天（CML 内置模块）"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  pulse_shared:
    path: ../shared
  ffi: ^2.1.0
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  file_selector: ^1.0.3
  image: ^4.3.0
  crypto: ^3.0.6
  desktop_drop: ^0.8.0
  tray_manager: ^0.5.0
  window_manager: ^0.5.0

dev_dependencies:
  pulse_server:
    path: ../server
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray.ico
