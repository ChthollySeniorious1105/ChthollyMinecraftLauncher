<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="pet.css">
</head>
<body>
  <div id="stage">
    <div id="bubble" class="hidden"><span id="bubble-text"></span></div>
    <div id="pet-wrap">
      <div id="fx"></div>
      <div id="pet-body">
        <img id="pet" draggable="false" alt="">
        <div id="wear"></div>
      </div>
      <svg id="shadow" viewBox="0 0 200 30"><ellipse cx="100" cy="15" rx="80" ry="10" /></svg>
    </div>
    <div id="pomo-badge" class="hidden" title="番茄钟">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="8.5" fill="#e8553a"/><path d="M12 5.5c-1.8-2-4-2-5-1.5 1.3.3 2.3 1 3 2-1.6-.3-3 .2-3.6 1 1.6-.2 3.3.1 4.6 1 .5-1 2.5-1.8 4.8-1.2-.7-1-2-1.5-3.3-1.3.8-.9 1.7-1.3 3-1.4-1.3-.7-3.1-.4-3.5 1.4z" fill="#5a9c3a"/></svg>
      <span id="pomo-time">25:00</span>
    </div>
    <div id="need-badge" class="hidden" title="需要照顾"></div>
    <div id="quick" class="hidden">
      <button data-q="feed" title="喂食"><svg viewBox="0 0 24 24"><path d="M12 6.5c-2.4-1.8-7.2-1.2-7.2 4.8 0 4.2 3 7.8 4.8 7.8 1.2 0 1.8-.6 2.4-.6s1.2.6 2.4.6c1.8 0 4.8-3.6 4.8-7.8 0-6-4.8-6.6-7.2-4.8z" fill="#e8553a"/><path d="M12 6.5c0-1.8.6-3.6 1.8-4.8" stroke="#6b3f24" stroke-width="1.4" fill="none"/><path d="M12.6 4.2c1.8-1.8 4.2-1.8 4.8-1.2-1.2 1.8-3 2.4-4.8 1.2z" fill="#5da35a"/></svg></button>
      <button data-q="play" title="玩耍"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="#f3c34a"/><path d="M4 12c4.8-3 12-3 16 0M12 4c-3 4.8-3 12 0 16" stroke="#e8553a" stroke-width="1.8" fill="none"/></svg></button>
      <button data-q="care" title="照顾"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.3-8.6-8.6C2.2 8 4.3 4.8 7.4 4.8c2 0 3.5 1.1 4.6 2.6 1.1-1.5 2.6-2.6 4.6-2.6 3.1 0 5.2 3.2 4 6.6C19 15.7 12 20 12 20z" fill="#f06f7e"/></svg></button>
      <button data-q="focus" title="番茄钟"><svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5" fill="#e8553a"/><path d="M12 10v3.5l2.5 1.5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M12 6c-1-2-3-2.5-4.5-2M12 6c1-2 3-2.5 4.5-2" stroke="#5a9c3a" stroke-width="1.8" fill="none"/></svg></button>
    </div>
    <button id="menu-btn" title="打开菜单">
      <svg viewBox="0 0 32 32">
        <circle class="mb-bg" cx="16" cy="16" r="15" stroke-width="2"/>
        <circle class="mb-dot" cx="10" cy="16" r="2.4"/>
        <circle class="mb-dot" cx="16" cy="16" r="2.4"/>
        <circle class="mb-dot" cx="22" cy="16" r="2.4"/>
      </svg>
    </button>
  </div>
  <script src="../shared/cml-theme.js"></script>
  <script src="../shared/wardrobe.js"></script>
  <script src="../shared/anchors.js"></script>
  <script src="../shared/festivals.js"></script>
  <script src="pet.js"></script>
</body>
</html>
